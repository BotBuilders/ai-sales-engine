interface:
  display_name: "AI Sales Engines"
  short_description: "Build your offer, sales webinar, and course from the BotBuilders library"
  default_prompt: "Use $ai-sales-engine to build my offer, sales webinar, or course."
dependencies:
  tools:
    - type: "mcp"
      value: "list_skills"
      description: "Lists the chapters of the AI Sales Engines library. Call with path ai-sales-engine."
      transport: "streamable_http"
      url: "https://ai-skills.botbuilders.com/mcp/"
    - type: "mcp"
      value: "get_skill"
      description: "Reads one chapter of the AI Sales Engines library in full, page by page."
      transport: "streamable_http"
      url: "https://ai-skills.botbuilders.com/mcp/"
